# AIBrix Envoy Configuration - P/D Disaggregation Mode
#
# This configuration provides weighted routing between prefill and decode engines.
# For intelligent P/D routing based on request characteristics, enable the
# gateway-plugin service which makes dynamic routing decisions.
#
# Weighted routing strategy:
# - 30% to prefill engine (optimized for prompt processing)
# - 70% to decode engine (optimized for token generation)

admin:
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 9901
  access_log:
    - name: envoy.access_loggers.stdout
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog

static_resources:
  listeners:
    - name: http_listener
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 80
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http
                codec_type: AUTO

                # Enable streaming for LLM responses
                stream_idle_timeout: 300s
                request_timeout: 600s

                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                      log_format:
                        text_format: "[%START_TIME%] \"%REQ(:METHOD)% %REQ(:PATH)% %PROTOCOL%\" %RESPONSE_CODE% %RESPONSE_FLAGS% %BYTES_RECEIVED% %BYTES_SENT% %DURATION% \"%REQ(X-REQUEST-ID)%\" \"%UPSTREAM_HOST%\"\n"

                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: aibrix_api
                      domains: ["*"]
                      routes:
                        # ============================================
                        # OpenAI-Compatible Inference Endpoints
                        # Weighted routing between prefill and decode
                        # ============================================

                        - match:
                            prefix: "/v1/chat/completions"
                          route:
                            weighted_clusters:
                              clusters:
                                - name: prefill_engine
                                  weight: 30
                                - name: decode_engine
                                  weight: 70
                            timeout: 600s
                            idle_timeout: 300s
                            retry_policy:
                              retry_on: "connect-failure,refused-stream,unavailable,cancelled,resource-exhausted"
                              num_retries: 2
                              per_try_timeout: 600s

                        - match:
                            prefix: "/v1/completions"
                          route:
                            weighted_clusters:
                              clusters:
                                - name: prefill_engine
                                  weight: 30
                                - name: decode_engine
                                  weight: 70
                            timeout: 600s
                            idle_timeout: 300s
                            retry_policy:
                              retry_on: "connect-failure,refused-stream,unavailable,cancelled,resource-exhausted"
                              num_retries: 2
                              per_try_timeout: 600s

                        - match:
                            prefix: "/v1/embeddings"
                          route:
                            cluster: prefill_engine
                            timeout: 120s

                        # ============================================
                        # Metadata Service Endpoints
                        # ============================================

                        - match:
                            prefix: "/v1/models"
                          route:
                            cluster: metadata_service
                            timeout: 30s

                        - match:
                            prefix: "/v1/files"
                          route:
                            cluster: metadata_service
                            timeout: 120s

                        - match:
                            prefix: "/v1/batches"
                          route:
                            cluster: metadata_service
                            timeout: 30s

                        # ============================================
                        # Health & Monitoring
                        # ============================================

                        - match:
                            prefix: "/health"
                          route:
                            cluster: decode_engine
                            timeout: 10s

                        - match:
                            prefix: "/healthz"
                          direct_response:
                            status: 200
                            body:
                              inline_string: '{"status":"ok","mode":"pd_disaggregation"}'

                        # ============================================
                        # Direct engine access (for debugging)
                        # ============================================

                        - match:
                            prefix: "/prefill/"
                          route:
                            cluster: prefill_engine
                            prefix_rewrite: "/"
                            timeout: 120s

                        - match:
                            prefix: "/decode/"
                          route:
                            cluster: decode_engine
                            prefix_rewrite: "/"
                            timeout: 120s

                        - match:
                            prefix: "/v1/"
                          route:
                            cluster: decode_engine
                            timeout: 120s

                        # ============================================
                        # Catch-all
                        # ============================================

                        - match:
                            prefix: "/"
                          direct_response:
                            status: 404
                            body:
                              inline_string: '{"error":"Not Found","message":"Use /v1/chat/completions, /v1/models, or /health"}'

                http_filters:
                  - name: envoy.filters.http.request_id
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.request_id.v3.RequestIDConfig
                      pack_trace_reason: false

                  - name: envoy.filters.http.cors
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.Cors

                  - name: envoy.filters.http.health_check
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.health_check.v3.HealthCheck
                      pass_through_mode: false
                      headers:
                        - name: ":path"
                          string_match:
                            exact: "/envoy-health"

                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    # ============================================
    # Prefill Engine
    # Optimized for prompt processing (KV cache generation)
    # ============================================

    - name: prefill_engine
      type: STRICT_DNS
      dns_lookup_family: V4_ONLY
      lb_policy: ROUND_ROBIN

      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http_protocol_options:
              enable_trailers: true

      load_assignment:
        cluster_name: prefill_engine
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: prefill-engine
                      port_value: 8000

      health_checks:
        - timeout: 10s
          interval: 30s
          unhealthy_threshold: 3
          healthy_threshold: 1
          http_health_check:
            path: /health

      circuit_breakers:
        thresholds:
          - priority: DEFAULT
            max_connections: 500
            max_pending_requests: 500
            max_requests: 500
            max_retries: 3

      connect_timeout: 30s

      outlier_detection:
        consecutive_5xx: 5
        interval: 30s
        base_ejection_time: 60s
        max_ejection_percent: 50

    # ============================================
    # Decode Engine
    # Optimized for token generation
    # ============================================

    - name: decode_engine
      type: STRICT_DNS
      dns_lookup_family: V4_ONLY
      lb_policy: ROUND_ROBIN

      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http_protocol_options:
              enable_trailers: true

      load_assignment:
        cluster_name: decode_engine
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: decode-engine
                      port_value: 8000

      health_checks:
        - timeout: 10s
          interval: 30s
          unhealthy_threshold: 3
          healthy_threshold: 1
          http_health_check:
            path: /health

      circuit_breakers:
        thresholds:
          - priority: DEFAULT
            max_connections: 1000
            max_pending_requests: 1000
            max_requests: 1000
            max_retries: 3

      connect_timeout: 30s

      outlier_detection:
        consecutive_5xx: 5
        interval: 30s
        base_ejection_time: 60s
        max_ejection_percent: 50

    # ============================================
    # Metadata Service
    # ============================================

    - name: metadata_service
      type: STRICT_DNS
      dns_lookup_family: V4_ONLY
      lb_policy: ROUND_ROBIN

      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http_protocol_options: {}

      load_assignment:
        cluster_name: metadata_service
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: metadata-service
                      port_value: 8090

      health_checks:
        - timeout: 5s
          interval: 10s
          unhealthy_threshold: 3
          healthy_threshold: 1
          http_health_check:
            path: /healthz

      connect_timeout: 5s

      circuit_breakers:
        thresholds:
          - priority: DEFAULT
            max_connections: 100
            max_pending_requests: 100
            max_requests: 100
