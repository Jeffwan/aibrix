# AIBrix Envoy Configuration
#
# This configuration provides:
# - HTTP/1.1 and HTTP/2 support with auto-detection
# - Intelligent routing to vLLM backends
# - Streaming support for chat completions
# - Health checks and circuit breaking
# - Request/response timeouts for LLM workloads
# - Admin interface for debugging

admin:
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 9901
  access_log:
    - name: envoy.access_loggers.stdout
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog

static_resources:
  listeners:
    - name: http_listener
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 80
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http
                codec_type: AUTO

                # Enable streaming for LLM responses
                stream_idle_timeout: 300s
                request_timeout: 600s

                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                      log_format:
                        text_format: "[%START_TIME%] \"%REQ(:METHOD)% %REQ(:PATH)% %PROTOCOL%\" %RESPONSE_CODE% %RESPONSE_FLAGS% %BYTES_RECEIVED% %BYTES_SENT% %DURATION% \"%REQ(X-REQUEST-ID)%\" \"%REQ(:AUTHORITY)%\" \"%UPSTREAM_HOST%\"\n"

                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: aibrix_api
                      domains: ["*"]
                      routes:
                        # ============================================
                        # OpenAI-Compatible Inference Endpoints
                        # Route to vLLM backend(s)
                        # ============================================

                        - match:
                            prefix: "/v1/chat/completions"
                          route:
                            cluster: vllm_backend
                            timeout: 600s
                            idle_timeout: 300s
                            retry_policy:
                              retry_on: "connect-failure,refused-stream,unavailable,cancelled,resource-exhausted"
                              num_retries: 2
                              per_try_timeout: 600s

                        - match:
                            prefix: "/v1/completions"
                          route:
                            cluster: vllm_backend
                            timeout: 600s
                            idle_timeout: 300s
                            retry_policy:
                              retry_on: "connect-failure,refused-stream,unavailable,cancelled,resource-exhausted"
                              num_retries: 2
                              per_try_timeout: 600s

                        - match:
                            prefix: "/v1/embeddings"
                          route:
                            cluster: vllm_backend
                            timeout: 120s

                        # ============================================
                        # Metadata Service Endpoints
                        # Model registry, files, batch jobs
                        # ============================================

                        - match:
                            prefix: "/v1/models"
                          route:
                            cluster: metadata_service
                            timeout: 30s

                        - match:
                            prefix: "/v1/files"
                          route:
                            cluster: metadata_service
                            timeout: 120s

                        - match:
                            prefix: "/v1/batches"
                          route:
                            cluster: metadata_service
                            timeout: 30s

                        # ============================================
                        # Health & Monitoring
                        # ============================================

                        - match:
                            prefix: "/health"
                          route:
                            cluster: vllm_backend
                            timeout: 10s

                        - match:
                            prefix: "/healthz"
                          direct_response:
                            status: 200
                            body:
                              inline_string: '{"status":"ok"}'

                        - match:
                            prefix: "/readyz"
                          route:
                            cluster: vllm_backend
                            timeout: 10s

                        # ============================================
                        # vLLM Direct Access (for debugging)
                        # ============================================

                        - match:
                            prefix: "/v1/"
                          route:
                            cluster: vllm_backend
                            timeout: 120s

                        # ============================================
                        # Catch-all - 404
                        # ============================================

                        - match:
                            prefix: "/"
                          direct_response:
                            status: 404
                            body:
                              inline_string: '{"error":"Not Found","message":"Use /v1/chat/completions, /v1/models, or /health"}'

                http_filters:
                  # Add request ID for tracing
                  - name: envoy.filters.http.request_id
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.request_id.v3.RequestIDConfig
                      pack_trace_reason: false

                  # CORS support
                  - name: envoy.filters.http.cors
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.Cors

                  # Health check filter
                  - name: envoy.filters.http.health_check
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.health_check.v3.HealthCheck
                      pass_through_mode: false
                      headers:
                        - name: ":path"
                          string_match:
                            exact: "/envoy-health"

                  # Router (must be last)
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    # ============================================
    # vLLM Backend Cluster
    # Primary inference endpoint
    # ============================================

    - name: vllm_backend
      type: STRICT_DNS
      dns_lookup_family: V4_ONLY
      lb_policy: ROUND_ROBIN

      # HTTP/1.1 for vLLM (it doesn't support HTTP/2 natively)
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http_protocol_options:
              enable_trailers: true

      load_assignment:
        cluster_name: vllm_backend
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: vllm
                      port_value: 8000

      # Health checking
      health_checks:
        - timeout: 10s
          interval: 30s
          unhealthy_threshold: 3
          healthy_threshold: 1
          http_health_check:
            path: /health

      # Circuit breaker
      circuit_breakers:
        thresholds:
          - priority: DEFAULT
            max_connections: 1000
            max_pending_requests: 1000
            max_requests: 1000
            max_retries: 3

      # Connection pooling
      connect_timeout: 30s

      # Outlier detection (remove unhealthy hosts)
      outlier_detection:
        consecutive_5xx: 5
        interval: 30s
        base_ejection_time: 60s
        max_ejection_percent: 50

    # ============================================
    # Metadata Service Cluster
    # Model registry, files, batch management
    # ============================================

    - name: metadata_service
      type: STRICT_DNS
      dns_lookup_family: V4_ONLY
      lb_policy: ROUND_ROBIN

      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http_protocol_options: {}

      load_assignment:
        cluster_name: metadata_service
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: metadata-service
                      port_value: 8090

      health_checks:
        - timeout: 5s
          interval: 10s
          unhealthy_threshold: 3
          healthy_threshold: 1
          http_health_check:
            path: /healthz

      connect_timeout: 5s

      circuit_breakers:
        thresholds:
          - priority: DEFAULT
            max_connections: 100
            max_pending_requests: 100
            max_requests: 100

